###############################################################################
# TypeDoc → GitHub Pages (gh-pages branch)
# -----------------------------------------
# Source of truth: main (typedoc.json, docs-theme.*, lib/, components/)
# Published site:  gh-pages branch (generated HTML only)
# URL:             https://arman-danesh.github.io/my-resume/
#
# Triggers:
#   - Push to main (docs-related paths or full tree)
#   - Published GitHub Release
#   - Version tags (v*)
#   - Manual "Run workflow"
###############################################################################

name: Docs

on:
  push:
    branches:
      - main
    paths:
      - "lib/**"
      - "components/**"
      - "typedoc.json"
      - "docs-theme.css"
      - "docs-theme.js"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "README.md"
      - ".github/workflows/docs.yml"
  release:
    types: [published]
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: docs-gh-pages
  cancel-in-progress: true

jobs:
  build-and-deploy-docs:
    name: Build TypeDoc & deploy to gh-pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Generate TypeDoc site
        run: npm run docs

      - name: Ensure .nojekyll (GitHub Pages)
        run: |
          touch docs/.nojekyll
          # Fail fast if theme assets were not copied into the build
          test -f docs/assets/style.css || test -d docs/assets
          ls -la docs/ | head -40

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          enable_jekyll: false
          force_orphan: true
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "docs: publish TypeDoc (${{ github.sha }})"
